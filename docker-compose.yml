services:
  thaddeus-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thaddeus-portfolio-production
    restart: unless-stopped

    ports:
      - "8005:8000"

    env_file:
      - .env

    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate dashboard &&
        python manage.py migrate django_portfolio &&
        gunicorn django_portfolio.wsgi:application --bind 0.0.0.0 --workers 1
      "
  nginx:
    image: nginx:alpine
    container_name: thaddeus-portfolio-static
    restart: unless-stopped

    ports:
      - "8006:80"

    volumes:
      - ./staticfiles:/usr/share/nginx/html/static:ro
      - ./media:/usr/share/nginx/html/media:ro
